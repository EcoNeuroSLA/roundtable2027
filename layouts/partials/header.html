<div class="container mt-5">
    <nav class="navbar navbar-expand-sm flex-column text-nowrap p-0" style="align-items:flex-start; gap:1rem;">
        <div class="navbar-nav flex-row flex-wrap site-menu">
            {{ range .Site.Menus.main }}
                <a class="nav-item nav-link" href="{{ .URL | relURL }}" title="{{ .Name }}">
                    {{ .Pre }}{{ .Name }}{{ .Post }}
                </a>
            {{ end }}
        </div>
        <div>
            <a class="navbar-brand mx-0 site-title" href="{{ .Site.BaseURL }}">
                {{ with .Site.Params.logo }}
                    <img src="{{ . | absURL }}" alt="logo">
                {{ end }}
                {{ .Site.Title }}
            </a>
            {{ with .Site.Params.subtitle }}
                <div class="site-subtitle">{{ . | markdownify }}</div>
            {{ end }}
        </div>
    </nav>
</div>
<hr>
